name: Helm Chart
on:
  push:
    branches:
      - main
    paths:
      - calendar-chart
      - .github/workflows/helm_chart.yaml.yml
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set chart version
        working-directory: calendar-chart
        run: |
          yq -i '.version = "1.0.${{ github.run_number }}"' Chart.yaml
      - name: Log in to the OCI registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        with:
          oci_registry_url: oci://ghcr.io/${{ github.repository }}
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
